name: aim

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aim
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
    ports:
      - "${AIM_POSTGRES_PORT:-55434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim -d aim"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aim:aim@postgres:5432/aim
      API_HOST: 0.0.0.0
      API_PORT: 8000
      AUTH_SECRET: ${AUTH_SECRET:-aim-development-secret}
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-aim-agent-development-secret}
      AIM_CONTENT_ROOT: /app/content
      AIM_ATTACHMENTS_ROOT: /data/attachments
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    ports:
      - "${AIM_API_PORT:-8100}:8000"
    volumes:
      # 用户在 AIM 里发的图片。实际卷名 aim_attachments，每日备份会一并打包。
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  eve:
    build:
      context: ../../services/agent
      dockerfile: Dockerfile
    environment:
      PORT: 2000
      HOST: 0.0.0.0
      EVE_USE_MOCK_MODEL: ${EVE_USE_MOCK_MODEL:-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AIM_AGENT_MODEL: ${AIM_AGENT_MODEL:-deepseek-chat}
      AIM_API_INTERNAL_URL: http://api:8000
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-aim-agent-development-secret}
    ports:
      - "${AIM_EVE_PORT:-2210}:2000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - eve-workflow-data:/app/.eve/.workflow-data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2000/eve/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 本地网关。和生产同构，让对话面与 API 同源——事件流要走真实网络请求，
  # fetch 才能边收边解。
  gateway:
    image: nginx:1.27-alpine
    # 只在本地起。生产的网关是系统 nginx（80 端口，配置来自 nginx-aim.conf），
    # 再起一个容器既多占那台 2C/1.8G 的资源，挂的 dist 目录在服务器上也不存在。
    profiles: ["local"]
    ports:
      - "${AIM_GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/agent-web/dist:/srv/agent-web:ro
      - ../../apps/legal:/srv/legal:ro
    depends_on:
      api:
        condition: service_healthy
      eve:
        condition: service_healthy

volumes:
  postgres-data:
  eve-workflow-data:
  attachments:
