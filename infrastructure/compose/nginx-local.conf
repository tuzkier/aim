# 本地网关，结构与生产的 nginx-aim.conf 一致。
#
# 存在的理由不是「本地也要限流」，而是**同源**：对话面的前端要和 /api/ /eve/
# 落在同一个 origin 上，事件流才能被 fetch 边收边解。本地少了这一层的话，
# 开发和线上就是两套拓扑，UI 测试也验不到真实链路。
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20m;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx-local"}';
    }

    location /agent/ {
        alias /srv/agent-web/;
        try_files $uri $uri/ /agent/index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # 事件流：关缓冲、放长超时，和生产一致。
    location /eve/ {
        proxy_pass http://eve:2000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / { return 404; }
}
