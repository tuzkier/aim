# 演示登录接口限流：每 IP 每分钟 5 次，突发 3
limit_req_zone $binary_remote_addr zone=aim_login:10m rate=5r/m;
# 普通接口限流：每 IP 每秒 20 次
limit_req_zone $binary_remote_addr zone=aim_api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    access_log /var/log/nginx/aim.access.log;
    error_log  /var/log/nginx/aim.error.log;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # 注册与登录单独收紧。必须是前缀匹配而不是精确匹配某一个路径——
    # 漏掉一个端点，它就会落到下面 /api/ 的 20r/s 那档，
    # 等于对着密码接口敞开暴力破解。
    location /api/v1/auth/ {
        limit_req zone=aim_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=aim_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Eve 是 SSE 流式接口，必须关闭缓冲并放长超时
    location /eve/ {
        limit_req zone=aim_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 对话面的前端产物。
    #
    # 必须和 /api/ /eve/ 同源：页面里的事件流是长连接，只有走真实网络请求
    # fetch 才能边收边解。此前它从 App bundle 经自定义 scheme 加载，
    # WKURLSchemeHandler 会把 body 缓冲到请求结束才交给 fetch，而事件流
    # 一直不关闭——原生侧数据到齐了，页面上一个字都不出现。
    location /agent/ {
        alias /opt/aim/web/;
        try_files $uri $uri/ /agent/index.html;
        # 产物文件名带内容哈希，可以长缓存；入口不行，否则发了新版也换不掉。
        location ~* \.(js|css|woff2|png|svg)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /agent/index.html {
        alias /opt/aim/web/index.html;
        add_header Cache-Control "no-store";
    }

    # 隐私政策与用户协议。App Store Connect 要一个可公开访问的隐私政策 URL，
    # 注册页与家庭页也从这里打开。纯静态文件，不走 API。
    location /legal/ {
        alias /opt/aim/legal/;
        add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
