# 演示登录接口限流：每 IP 每分钟 5 次，突发 3
limit_req_zone $binary_remote_addr zone=aim_login:10m rate=5r/m;
# 普通接口限流：每 IP 每秒 20 次
limit_req_zone $binary_remote_addr zone=aim_api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20m;
    access_log /var/log/nginx/aim.access.log;
    error_log  /var/log/nginx/aim.error.log;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # 注册与登录单独收紧。必须是前缀匹配而不是精确匹配某一个路径——
    # 漏掉一个端点，它就会落到下面 /api/ 的 20r/s 那档，
    # 等于对着密码接口敞开暴力破解。
    location /api/v1/auth/ {
        limit_req zone=aim_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=aim_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Eve 是 SSE 流式接口，必须关闭缓冲并放长超时
    location /eve/ {
        limit_req zone=aim_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2210;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / { return 404; }
}
