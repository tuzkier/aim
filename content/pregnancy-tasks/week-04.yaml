id: pregnancy-week-04
version: 1.0.0
source: 中华医学会妇产科学分会《孕前和孕期保健指南（2018）》；中国营养学会《中国居民膳食指南（2022）》孕期妇女膳食指南；国家卫生健康委员会公开的孕产期保健资料
source_url: https://www.nhc.gov.cn/
reviewed_at: "2026-10-10"
applicability:
  region: [CN, CN-ZJ, CN-ZJ-HZ]
  gestational_weeks: [4]
items:
  - id: w04-confirm-pregnancy
    title: 确认怀孕并记下末次月经
    summary: 用验孕棒或去医院确认怀孕，记下末次月经第一天，医生会用它推算孕周和预产期。
    due_in_days: 0
    source_type: template
    priority: 100
  - id: w04-folic-acid
    title: 开始每天补叶酸
    summary: 还没吃的从今天开始，常见剂量每天 0.4 毫克，至少吃到孕 3 个月；特殊情况听医生的。
    due_in_days: 0
    source_type: template
    priority: 90
  - id: w04-avoid-risks
    title: 避免烟酒与随意用药
    summary: 戒烟戒酒，远离二手烟；吃药或保健品前先问医生或药师，正在吃的药也别自己停。
    due_in_days: 1
    source_type: template
    priority: 80
