id: pregnancy-week-29-32
version: 1.0.0
source: 中华医学会妇产科学分会《孕前和孕期保健指南（2018）》；中国营养学会《中国居民膳食指南（2022）》孕期妇女膳食指南；国家卫生健康委员会公开的孕产期保健资料
source_url: https://www.nhc.gov.cn/
reviewed_at: "2026-10-10"
applicability:
  region: [CN, CN-ZJ, CN-ZJ-HZ]
  gestational_weeks: [29, 30, 31, 32]
items:
  - id: w29-fetal-count
    title: 每天数一次胎动
    summary: 选宝宝活跃的时段数到 10 次；2 小时内不足 10 次或比平时明显少，尽快联系医院。
    due_in_days: 0
    source_type: template
    priority: 100
  - id: w29-hospital-route
    title: 确定分娩医院与去医院路线
    summary: 确认在哪家医院生，记下产科急诊位置和夜间入口，想好白天和夜里分别怎么去。
    due_in_days: 7
    source_type: template
    priority: 70
  - id: w29-hospital-bag
    title: 开始准备待产包
    summary: 按证件资料、妈妈用品、宝宝用品三类列清单，先问医院提供什么，35 周左右收齐。
    due_in_days: 7
    source_type: template
    priority: 60
  - id: w29-epidural
    title: 了解无痛分娩
    summary: 问产检医院能不能做无痛分娩、怎么申请；有顾虑或腰椎病史的，产检时和医生聊聊。
    due_in_days: 7
    source_type: template
    priority: 40
