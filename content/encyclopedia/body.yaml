id: encyclopedia-body
version: 0.1.0
source: 中华医学会妇产科学分会《孕前和孕期保健指南（2018）》；中国营养学会《中国居民膳食指南（2022）》孕期妇女膳食指南；国家卫生健康委员会公开的孕产期保健资料
source_url: https://www.nhc.gov.cn/
reviewed_at: null
review_status: draft
entries:
  - id: body.morning-sickness
    title: 孕吐
    aliases: [早孕反应, 恶心, 想吐, 害喜, 吐得厉害]
    weeks: [5, 14]
    summary: 孕早期恶心呕吐很常见，多数在孕 12–14 周前后逐渐减轻，少数会持续更久。
    sections:
      - heading: 为什么会吐
        text: 和孕早期激素变化有关，常在孕 6 周左右出现，8–10 周比较明显。不一定只在早上，一天中任何时候都可能发生，闻到油烟或某些气味时更容易加重。
      - heading: 怎么缓解
        text: 少量多餐，别让胃完全空着；起床前先吃几片饼干；避开引起恶心的气味；吐后漱口、小口补水。吃得少一段时间一般不会影响宝宝，不必过度焦虑。
      - heading: 什么时候找医生
        text: 吃什么吐什么、连水都喝不下，尿量明显变少或颜色很深，体重明显下降，头晕乏力站不稳，或吐出血丝、咖啡色东西时，尽快就医，可能需要补液治疗。
    ask: [孕吐什么时候结束, 吐得吃不下东西怎么办, 孕吐严重会影响宝宝吗]
    related: [diet.eating-with-nausea, body.fatigue, checkup.urine-routine]

  - id: body.early-bleeding-pain
    title: 孕早期出血与腹痛
    aliases: [见红, 宫外孕, 先兆流产, 肚子疼, 早孕出血, 阴道出血]
    weeks: [4, 13]
    summary: 孕早期少量出血或轻微腹痛并不少见，但原因自己分辨不了，都要让医生评估。
    sections:
      - heading: 是什么
        text: 孕早期有些人会出现少量点滴出血，颜色淡红或褐色，有时伴有轻微的下腹隐痛或坠胀。原因有很多，有的并不要紧，也可能与先兆流产或宫外孕有关。光看症状没法自己判断，需要医生通过检查和 B 超来评估。
      - heading: 先怎么做
        text: 先别慌，垫上卫生巾，留意出血的量和颜色、什么时候开始、有没有腹痛，就诊时告诉医生。多休息，不要自行用药或往阴道里放药。还没做过 B 超确认宫内怀孕的，就诊时主动说明。
      - heading: 什么时候找医生
        text: 一侧下腹剧烈疼痛、晕倒或头晕眼花、肩膀疼痛、出血量多（像月经那么多或更多）或有血块时，立即去急诊，必要时叫救护车。其他任何孕早期出血，也应尽快联系医生，不要自己判断、在家硬等。
    ask: [孕早期少量出血要去医院吗, 早孕出血去医院会查什么, 宫外孕有哪些危险信号]
    related: [checkup.first-visit, body.discharge, body.morning-sickness]

  - id: body.fatigue
    title: 乏力嗜睡
    aliases: [犯困, 没力气, 总想睡, 疲惫, 累]
    weeks: [4, 14]
    summary: 孕早期特别容易累、犯困，是身体适应怀孕的正常反应，多数到孕中期会好转。
    sections:
      - heading: 为什么会累
        text: 孕早期激素水平变化、身体代谢加快，加上孕吐影响进食和睡眠，很多人会觉得怎么睡都不够。
      - heading: 怎么调整
        text: 能休息就休息，午间小睡一会儿；保证规律三餐和充足饮水；每天适当散步。工作中可以和同事、上级沟通，把重要的事放在精神好的时段。
      - heading: 什么时候找医生
        text: 伴有头晕、心慌、气短、脸色苍白，可能和贫血有关；如果长期情绪低落、对什么都提不起兴趣，也要告诉医生。孕中晚期仍然非常疲惫时，产检时说一下。
    ask: [怀孕总想睡觉正常吗, 上班犯困怎么办, 累得不行要查什么]
    related: [body.morning-sickness, checkup.blood-routine, body.mood]

  - id: body.frequent-urination
    title: 尿频
    aliases: [老想上厕所, 跑厕所, 憋不住尿, 漏尿]
    weeks: [6, 14]
    summary: 孕早期子宫增大压迫膀胱，孕晚期宝宝入盆，都会让人频繁想上厕所，大多是正常现象。
    sections:
      - heading: 为什么会尿频
        text: 孕早期子宫增大、肾脏血流增加，尿量变多；孕中期子宫升入腹腔后多会缓解；孕晚期宝宝头部下降压迫膀胱，又会再次明显。
      - heading: 怎么应对
        text: 有尿意就去，不要憋尿；白天正常喝水，睡前 1–2 小时少喝一点，减少起夜；咳嗽或打喷嚏时漏一点尿在孕晚期也常见，可以练习盆底肌收缩。
      - heading: 什么时候找医生
        text: 排尿时疼痛、灼热，尿里带血，伴有发热或腰痛时，可能是泌尿系统感染，要及时就医。孕晚期内裤持续被清水样液体打湿、分不清是尿还是羊水时，尽快去医院检查。
    ask: [晚上起夜好几次正常吗, 漏尿还是破水怎么分, 为了少上厕所能少喝水吗]
    related: [checkup.urine-routine, birth.signs-of-labor, body.discharge]

  - id: body.constipation
    title: 便秘
    aliases: [拉不出来, 大便干, 排便难, 痔疮]
    weeks: [8, 40]
    summary: 孕期激素让肠道蠕动变慢，加上子宫压迫和补铁，便秘很常见，多数靠饮食和活动可以改善。
    sections:
      - heading: 怎么改善
        text: 多吃全谷物、杂豆、蔬菜和水果，增加膳食纤维；每天喝足够的水；每天散步等适量活动；养成定时排便的习惯，有便意别忍着。
      - heading: 用药注意
        text: 不要自行使用泻药、开塞露或通便茶。如果铁剂让便秘加重，可以和医生商量调整，不要自己停药。
      - heading: 什么时候找医生
        text: 好几天没有排便并伴腹胀腹痛，排便时出血或肛门疼痛明显，或者便秘和腹泻交替出现时，及时就医。
    ask: [孕期便秘能用开塞露吗, 吃什么能通便, 便秘用力会伤到宝宝吗]
    related: [diet.iron-and-folate, life.exercise, diet.weight-gain]

  - id: body.back-pain
    title: 腰酸背痛
    aliases: [腰疼, 腰酸, 背痛, 耻骨疼, 屁股疼]
    weeks: [16, 40]
    summary: 肚子变大、重心前移，加上韧带变松，孕中晚期腰背酸痛很常见。
    sections:
      - heading: 为什么会痛
        text: 随着子宫增大，身体重心前移，腰背肌肉负担加重；孕期激素让关节和韧带变松，耻骨和骨盆周围也可能不舒服。
      - heading: 怎么缓解
        text: 站坐时保持背部挺直，避免长时间同一姿势；穿低跟舒适的鞋；睡觉时侧卧，在两腿之间、腰后垫枕头；适当做孕妇瑜伽、游泳等温和运动；可以用托腹带分担重量。
      - heading: 什么时候找医生
        text: 腰痛伴有规律的发紧或下坠感（尤其不足 37 周），伴发热、尿痛，腿部麻木无力，或疼痛剧烈影响走路和睡眠时，及时就医。
    ask: [腰疼能贴膏药吗, 托腹带有用吗, 耻骨疼走不了路怎么办]
    related: [life.sleep-position, life.exercise, body.braxton-hicks]

  - id: body.leg-cramps
    title: 腿抽筋
    aliases: [小腿抽筋, 半夜抽筋, 腿抽, 抽筋]
    weeks: [20, 40]
    summary: 孕中晚期夜里小腿抽筋很常见，发作时把脚尖往身体方向勾起来通常能缓解。
    sections:
      - heading: 发作时怎么办
        text: 伸直腿，把脚尖慢慢往身体方向勾，或者请家人帮忙轻轻推脚掌；也可以下地站一会儿，再按摩、热敷小腿。
      - heading: 平时怎么预防
        text: 睡前拉伸小腿，白天适当活动，避免久站久坐；注意腿部保暖；饮食中保证奶类等含钙食物。是否需要额外补钙，请按医生建议，不必一抽筋就自行加钙片。
      - heading: 什么时候找医生
        text: 一侧小腿持续肿胀、疼痛、发红发热，不像普通抽筋那样很快缓解时，可能是静脉血栓，要尽快就医。抽筋非常频繁时，产检时告诉医生。
    ask: [抽筋是缺钙吗, 半夜抽筋怎么快速缓解, 钙片要吃多少]
    related: [diet.calcium, body.edema, life.exercise]

  - id: body.edema
    title: 水肿
    aliases: [脚肿, 腿肿, 浮肿, 脚踝肿, 手肿]
    weeks: [24, 40]
    summary: 孕晚期脚踝和小腿轻度水肿很常见，休息、抬高腿后会减轻；突然加重要警惕血压问题。
    sections:
      - heading: 为什么会肿
        text: 子宫增大压迫下腔静脉，下肢血液回流变慢，加上孕期体内水分增多，傍晚或久站后脚踝、小腿容易肿，早上起床时通常会减轻。
      - heading: 怎么缓解
        text: 避免久站久坐，休息时把腿垫高；睡觉多侧卧；穿宽松的鞋袜；饮食清淡，不要刻意少喝水。
      - heading: 什么时候找医生
        text: 脸部、手部突然明显肿胀，水肿短时间内迅速加重，或者伴有头痛、眼花、视物模糊、上腹痛时，可能与血压升高有关，要尽快就医。只有一侧腿肿并疼痛时也要及时检查。
    ask: [脚肿得穿不上鞋正常吗, 水肿要少喝水吗, 怎么判断是不是严重水肿]
    related: [body.leg-cramps, life.sleep-position, checkup.urine-routine]

  - id: body.stretch-marks
    title: 妊娠纹与皮肤瘙痒
    aliases: [妊娠纹, 肚皮痒, 皮肤痒, 身上痒, 手心痒]
    weeks: [16, 40]
    summary: 肚皮、大腿变大时容易长妊娠纹，皮肤也常干痒；手心脚心明显瘙痒要告诉医生。
    sections:
      - heading: 妊娠纹
        text: 是否长、长多少和体质关系很大，没有能保证完全预防的产品。控制体重增长不要过快、保持皮肤滋润可以让自己舒服一些。产后颜色通常会逐渐变淡。
      - heading: 皮肤干痒
        text: 洗澡水不要太热，洗后及时涂无香精的保湿霜；穿棉质宽松衣物；尽量别抓破皮肤。使用药膏前先问医生。
      - heading: 什么时候找医生
        text: 孕中晚期出现手心、脚心明显瘙痒，夜里更重，或者全身痒得睡不着，要尽快告诉医生，可能需要查肝功能和胆汁酸。皮疹、起水疱或皮肤发黄时也要就医。
    ask: [妊娠纹能预防吗, 晚上手心特别痒怎么办, 孕期能用身体乳吗]
    related: [diet.weight-gain, body.insomnia, checkup.blood-routine]

  - id: body.insomnia
    title: 失眠
    aliases: [睡不着, 睡不好, 半夜醒, 多梦, 失眠]
    weeks: [14, 40]
    summary: 孕期尿频、胎动、腰酸和焦虑都会影响睡眠，调整作息和睡姿能改善不少。
    sections:
      - heading: 为什么睡不好
        text: 孕中晚期肚子变大找不到舒服姿势，夜里起来上厕所、腿抽筋、胃灼热、胎动，加上对生产和育儿的担心，都会让睡眠变浅、变碎。
      - heading: 怎么改善
        text: 固定上床和起床时间；白天适当活动，午睡不要太长；睡前少看手机，晚饭别太晚太饱；侧卧并用枕头支撑肚子和腰背；睡不着时起来做点安静的事再回床上。
      - heading: 什么时候找医生
        text: 长期严重失眠影响白天生活，或者伴有持续情绪低落、焦虑、心慌时，告诉医生。不要自行服用安眠药或助眠保健品。
    ask: [孕晚期睡不着怎么办, 能吃褪黑素吗, 半夜醒来睡不着怎么办]
    related: [life.sleep-position, body.mood, body.heartburn]

  - id: body.heartburn
    title: 胃灼热
    aliases: [烧心, 反酸, 胃酸, 胃不舒服, 胃胀]
    weeks: [20, 40]
    summary: 孕期激素让胃部入口变松、子宫向上推挤胃，孕中晚期饭后烧心、反酸很常见。
    sections:
      - heading: 怎么缓解
        text: 少量多餐，吃饭慢一点；饭后不要马上躺下，等 1–2 小时；少吃油腻、辛辣、过酸的食物和含咖啡因饮料；睡觉时把上半身稍微垫高。
      - heading: 用药注意
        text: 症状明显时可以请医生开孕期可用的药物，不要自行服用胃药。
      - heading: 什么时候找医生
        text: 上腹部（尤其右上腹）持续疼痛，不像平时的烧心，或者伴有头痛、视物模糊、恶心呕吐时，要尽快就医排查血压和肝功能问题。
    ask: [孕期烧心能吃什么药, 晚上反酸睡不着怎么办, 喝牛奶能缓解烧心吗]
    related: [body.insomnia, life.sleep-position, diet.weight-gain]

  - id: body.fetal-movement
    title: 胎动与数胎动
    aliases: [胎动, 数胎动, 胎动少, 胎动计数, 宝宝不动]
    weeks: [16, 40]
    summary: 胎动是宝宝健康的重要信号。28 周起每天数一数，发现明显变少、变弱或停止要立即就医。
    sections:
      - heading: 什么时候开始感到
        text: 第一次怀孕的人多在 18–20 周左右感到胎动，起初像冒泡泡或轻轻的蠕动；生过孩子的人可能更早察觉。早一点晚一点都常见，此时还不需要计数。
      - heading: 怎么数
        text: 28 周起，每天选宝宝活跃的时段（如饭后、睡前），侧躺或坐着专心数。用「数到 10 次」法：记下开始时间，一阵连续的动只算一次，数到 10 次记下用了多久。2 小时内不足 10 次，要尽快联系医院。医生教过别的数法，以医生的为准。
      - heading: 最重要的是规律
        text: 每个宝宝的活动规律不同。比数字更重要的，是和宝宝自己平时的规律相比有没有明显变化。不同时段动得多少不一样是正常的，宝宝也会睡觉。
      - heading: 什么时候找医生
        text: 感到胎动和平时相比明显变少、变弱或停止时，不用数完，也不用等到第二天，立即联系医院或去产科急诊。不要靠喝冷水、吃甜食来「叫醒」宝宝而拖延就医。
    ask: [胎动一天多少次正常, 胎动变少了怎么办, 什么时候开始数胎动]
    related: [checkup.nst, birth.when-to-go, body.braxton-hicks]

  - id: body.braxton-hicks
    title: 假性宫缩与真宫缩
    aliases: [肚子发紧, 发硬, 假宫缩, 宫缩, 肚子一阵阵疼]
    weeks: [28, 40]
    summary: 孕晚期肚子时不时发紧发硬多是假性宫缩；变得规律、越来越密越来越痛的才可能是临产。
    sections:
      - heading: 假性宫缩
        text: 肚子一阵发紧变硬，持续时间短，间隔不规律，强度不会越来越大，换个姿势、休息或喝点水后常会缓解。多在孕晚期出现，傍晚和夜里更明显。
      - heading: 真宫缩
        text: 间隔越来越短、持续越来越长、疼痛越来越强，休息也不缓解，常从腰背部开始向前扩散。可以用手机记录每次开始的时间和持续多久，方便判断和告诉医生。
      - heading: 什么时候找医生
        text: 不足 37 周出现规律宫缩、下坠感或腰酸明显，要尽快去医院；足月后出现规律宫缩，按医生交代的时机去医院。伴有阴道流血、流水、持续腹痛不缓解或胎动减少时，立即就医。
    ask: [怎么区分真假宫缩, 肚子一天发硬好几次正常吗, 宫缩几分钟一次去医院]
    related: [birth.signs-of-labor, birth.when-to-go, body.fetal-movement]

  - id: body.discharge
    title: 阴道分泌物变化
    aliases: [白带多, 分泌物, 白带黄, 下面痒, 白带有味]
    weeks: [6, 40]
    summary: 孕期白带比平时多是常见现象；颜色、气味异常或伴瘙痒时可能是感染，要看医生。
    sections:
      - heading: 正常的样子
        text: 孕期激素和血流变化让分泌物增多，通常是白色或透明、稀薄、没有明显异味。勤换内裤、保持外阴清洁干爽即可。
      - heading: 日常护理
        text: 用清水清洗外阴，不要冲洗阴道，也不必用洗液；穿棉质透气内裤；不建议长期使用护垫。
      - heading: 什么时候找医生
        text: 分泌物变成黄绿色、豆腐渣样或有明显异味，伴瘙痒、灼热或疼痛时，及时就医，不要自行用药。出现阴道流血，或有持续的清水样液体流出时，尽快去医院。
    ask: [孕期白带多正常吗, 白带发黄要紧吗, 怎么分辨分泌物和羊水]
    related: [body.frequent-urination, birth.signs-of-labor, life.sex]

  - id: body.mood
    title: 情绪波动
    aliases: [情绪低落, 焦虑, 爱哭, 心情不好, 产前抑郁]
    weeks: [4, 40]
    summary: 孕期激素和生活变化让情绪起伏很常见；持续低落或焦虑超过两周，要主动寻求帮助。
    sections:
      - heading: 很常见
        text: 怀孕带来身体不适、睡眠变差，以及对产检结果、生产、工作和育儿的担心，容易烦躁、敏感、想哭。这不是你不够坚强，很多准妈妈都会经历。
      - heading: 可以做什么
        text: 把担心说给伴侣、家人或朋友听；保持规律作息和适度运动；减少反复搜索网上的极端案例；有疑问留到产检时直接问医生。伴侣可以多分担家务、陪同产检。
      - heading: 什么时候找医生
        text: 情绪低落、焦虑或对什么都没兴趣持续两周以上，影响吃饭睡眠和日常生活时，告诉产检医生，很多医院有孕期心理门诊。出现伤害自己的念头时，请立即告诉身边的人并尽快就医。
    ask: [孕期老想哭正常吗, 怎么判断产前抑郁, 去哪里看心理门诊]
    related: [body.insomnia, body.fatigue, life.exercise]
