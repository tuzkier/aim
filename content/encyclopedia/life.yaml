id: encyclopedia-life
version: 0.1.0
source: 中华医学会妇产科学分会《孕前和孕期保健指南（2018）》；中国营养学会《中国居民膳食指南（2022）》孕期妇女膳食指南；国家卫生健康委员会公开的孕产期保健资料
source_url: https://www.nhc.gov.cn/
reviewed_at: "2026-10-09"
review_status: reviewed
entries:
  - id: life.exercise
    title: 孕期运动
    aliases: [孕妇能运动吗, 散步, 孕妇瑜伽, 游泳, 健身]
    weeks: [12, 37]
    summary: 没有医学禁忌的孕妇适合规律做中等强度运动，散步、游泳、孕妇瑜伽都是常见选择。
    sections:
      - heading: 好处
        text: 规律运动有助于控制体重和血糖，缓解腰背痛和便秘，改善睡眠和情绪，也为分娩积攒体力。
      - heading: 怎么动
        text: 膳食指南建议孕中晚期每天进行约 30 分钟中等强度的身体活动，以运动时还能正常说话为宜。原本有运动习惯的可以在医生同意下继续，原本不运动的从散步开始慢慢加量。具体强度以医生意见为准。
      - heading: 要避开的
        text: 有摔倒或撞击风险的运动（如滑雪、骑马、球类对抗）、仰卧时间过长的动作、高温环境下运动，以及潜水。
      - heading: 什么时候找医生
        text: 运动中或运动后出现阴道流血或流水、规律宫缩、头晕、胸痛、气短明显、小腿肿痛或胎动明显减少时，立即停止并就医。有前置胎盘、宫颈机能不全等情况的，先问医生能不能运动。
    ask: [孕早期能运动吗, 一天走多少步合适, 孕期能做瑜伽吗]
    related: [diet.weight-gain, diet.blood-sugar, body.back-pain]

  - id: life.travel
    title: 出行与乘车
    aliases: [坐车, 开车, 坐飞机, 安全带, 坐高铁, 旅行]
    weeks: [4, 36]
    summary: 孕期出行注意正确系安全带、避免长时间不活动；孕中期通常是相对适合远行的时段。
    sections:
      - heading: 系安全带
        text: 坐车时一定系三点式安全带：腰带部分放在肚子下方、贴着大腿根部，肩带从两乳之间斜跨过，不要压在肚子上。
      - heading: 长途出行
        text: 每隔一两个小时起来走动一下，多喝水，避免下肢血栓。坐飞机前查好航空公司对孕周的要求，有的需要开具医生证明。出发前查好目的地附近的医院，随身带上产检资料。
      - heading: 什么时候找医生
        text: 有先兆流产、早产风险、前置胎盘等情况的，出行前先问医生。旅途中出现阴道流血、流水、腹痛、规律宫缩或胎动减少时，就近去医院。
    ask: [孕晚期能坐飞机吗, 孕妇能自己开车吗, 安全带会勒到宝宝吗]
    related: [life.work, body.edema, birth.when-to-go]

  - id: life.work
    title: 上班与久坐
    aliases: [上班, 久坐, 电脑辐射, 通勤, 办公室]
    weeks: [4, 40]
    summary: 多数孕妇可以正常上班，关键是避免久坐久站、接触有毒有害物质和过度劳累。
    sections:
      - heading: 办公室久坐
        text: 每隔一小时左右起来走动、伸展一下；椅子靠背垫个小靠垫支撑腰部；脚下垫个矮凳，有助减轻水肿。日常办公用的电脑、手机不需要特别担心辐射。
      - heading: 需要留意的工作
        text: 如果工作需要接触化学品、放射线、重体力劳动或长时间站立，告诉医生和单位，商量调整岗位。国家对孕期女职工有劳动保护规定，具体可以问单位人事或当地人社部门。
      - heading: 通勤
        text: 尽量错峰出行，乘公共交通时可以请别人让座；孕晚期如果通勤太辛苦，可以和单位商量弹性安排。
      - heading: 什么时候找医生
        text: 工作中出现明显腹痛、阴道流血、头晕眼花或持续的规律宫缩，及时就医，不要硬撑。
    ask: [孕妇上班要穿防辐射服吗, 久坐对宝宝有影响吗, 工作要接触化学品怎么办]
    related: [life.travel, paperwork.leave, body.edema]

  - id: life.sex
    title: 性生活
    aliases: [同房, 孕期同房, 房事, 夫妻生活]
    summary: 正常妊娠一般不需要完全禁止性生活，但有出血、早产风险等情况时要听医生的。
    sections:
      - heading: 一般原则
        text: 怀孕过程顺利的话，适度的性生活通常不会伤害宝宝。动作温和，避免压迫腹部，选择让孕妈妈舒服的姿势。孕早期和孕晚期很多医生建议更谨慎，具体可以在产检时问。
      - heading: 需要避免的情况
        text: 有阴道流血、先兆流产或早产迹象、前置胎盘、宫颈机能不全、已经破水等情况时，应避免性生活，具体听医生安排。
      - heading: 什么时候找医生
        text: 同房后出现持续腹痛、阴道流血或流水、规律宫缩时，及时就医。
    ask: [孕期什么时候可以同房, 同房后有点出血怎么办, 孕晚期同房会早产吗]
    related: [body.discharge, body.braxton-hicks, checkup.schedule]

  - id: life.medication
    title: 用药原则
    aliases: [吃药, 感冒药, 孕妇用药, 吃了药怎么办, 退烧药]
    summary: 孕期并非一概不能用药，关键是在医生指导下用；不要自行用药，也不要擅自停掉长期用的药。
    sections:
      - heading: 基本原则
        text: 看病和买药时主动说明自己怀孕和孕周。在医生或药师指导下用药，不自行购买药物、中药或保健品。病情需要时该用的药要用，硬扛可能对宝宝影响更大。
      - heading: 长期用药的人
        text: 有高血压、甲状腺病、癫痫、抑郁症等需要长期吃药的，确认怀孕后尽快就诊，由医生评估是否调整，千万不要因为怀孕擅自停药。
      - heading: 不知道怀孕时吃了药
        text: 不必慌张，也不要因此自行决定去留。记下药名、剂量和服药日期，带着药盒去问产科医生，必要时咨询医院的产前咨询门诊。
      - heading: 什么时候找医生
        text: 发热、咳嗽、腹泻等不适持续不缓解，或体温较高时，及时就医，并告诉医生你在怀孕。
    ask: [孕期感冒能吃药吗, 发烧能吃退烧药吗, 吃了药才发现怀孕怎么办]
    related: [checkup.thyroid, diet.alcohol, life.oral-care]

  - id: life.oral-care
    title: 口腔护理
    aliases: [牙龈出血, 看牙, 牙疼, 刷牙出血, 拔牙]
    summary: 孕期牙龈容易充血出血，好好刷牙、定期检查；需要治疗时，孕中期通常相对合适。
    sections:
      - heading: 为什么容易出问题
        text: 孕期激素变化让牙龈更敏感，容易红肿出血；孕吐时胃酸反流、少量多餐吃得更频繁，也让牙齿更容易受损。
      - heading: 日常护理
        text: 早晚用软毛牙刷刷牙，配合使用牙线；吐后用清水漱口，过一会儿再刷牙；少吃甜食和黏性零食。
      - heading: 看牙
        text: 最好在备孕时就做口腔检查。孕期有牙齿问题不要硬扛，看牙时告诉牙医你在怀孕和孕周；需要治疗或拍片时，牙医会做好防护并选择合适的时机，孕中期通常相对合适。
      - heading: 什么时候找医生
        text: 牙疼明显、牙龈肿胀化脓或面部肿胀、发热时，及时看牙医。
    ask: [孕期牙龈出血正常吗, 孕期能补牙吗, 孕期能洗牙吗]
    related: [life.medication, body.morning-sickness, checkup.schedule]

  - id: life.pets-and-toxoplasma
    title: 宠物与弓形虫
    aliases: [养猫, 弓形虫, 猫砂, 养狗, 宠物]
    summary: 怀孕不必把猫送走，做好卫生习惯，尤其避免直接清理猫砂、不吃生肉，就能大大降低感染风险。
    sections:
      - heading: 弓形虫从哪来
        text: 主要通过吃生的或没熟透的肉、没洗净的蔬果，以及接触被感染的猫的粪便传播。家里养了很久、只吃猫粮、不出门的猫，风险相对低。
      - heading: 怎么做
        text: 猫砂尽量请家人每天清理；必须自己清理时戴手套，结束后洗手。不喂猫生肉；做园艺时戴手套；处理生肉后洗手、刀板分开。养狗的同样注意卫生和疫苗。
      - heading: 什么时候找医生
        text: 出现发热、淋巴结肿大、乏力等类似感冒的症状并且有可疑接触时，告诉医生。是否需要做弓形虫检查，由医生判断。
    ask: [怀孕了要把猫送走吗, 要不要查弓形虫, 被猫抓了怎么办]
    related: [diet.raw-and-undercooked, diet.food-safety-habits]

  - id: life.sleep-position
    title: 睡姿
    aliases: [左侧卧, 侧睡, 平躺, 怎么睡, 睡姿]
    weeks: [16, 40]
    summary: 孕中晚期建议侧卧睡，左右侧都可以，用枕头支撑会舒服很多；醒来发现平躺了翻回来就好。
    sections:
      - heading: 为什么侧卧
        text: 孕中晚期长时间平躺，增大的子宫会压迫腹部的大血管，可能让人头晕、心慌，也会影响回流。侧卧更舒服，也有利于血液循环。
      - heading: 左侧还是右侧
        text: 很多医生推荐左侧卧，但左右交替侧卧都可以，不必为了只睡左边而整夜睡不好。
      - heading: 怎么更舒服
        text: 在两腿之间夹一个枕头，腰后和肚子下面各垫一个，或者用孕妇枕。夜里醒来发现自己平躺着，不用担心，翻回侧卧即可。
      - heading: 什么时候找医生
        text: 平躺时出现头晕、心慌、出冷汗，换成侧卧后仍不缓解，或者睡眠中出现明显呼吸暂停、憋醒时，告诉医生。
    ask: [一定要左侧卧吗, 晚上睡着平躺了怎么办, 孕妇枕有必要买吗]
    related: [body.insomnia, body.back-pain, body.edema]
