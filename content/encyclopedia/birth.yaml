id: encyclopedia-birth
version: 0.1.0
source: 中华医学会妇产科学分会《孕前和孕期保健指南（2018）》；中国营养学会《中国居民膳食指南（2022）》孕期妇女膳食指南；国家卫生健康委员会公开的孕产期保健资料
source_url: https://www.nhc.gov.cn/
reviewed_at: "2026-10-09"
review_status: reviewed
entries:
  - id: birth.signs-of-labor
    title: 产兆（见红、破水、规律宫缩）
    aliases: [见红, 破水, 规律宫缩, 要生了, 临产征兆]
    weeks: [36, 42]
    summary: 临产前常见三个信号：见红、破水、规律宫缩。出现其中任何一个，都要准备去医院或联系医生。
    sections:
      - heading: 见红
        text: 阴道流出少量带血的黏液，颜色粉红或褐色，通常在临产前一两天内出现，也可能更早。量少时可以先在家观察，收拾好东西，按医生交代的时机去医院。
      - heading: 破水
        text: 阴道突然流出较多清水样液体，或者持续一点点往外渗、控制不住。破水后不管有没有宫缩，都应立即去医院；垫上干净的卫生巾，不要洗澡。胎位不正（如臀位）或医生说过宝宝头还没入盆的，破水后尽量平躺，叫救护车去医院。
      - heading: 规律宫缩
        text: 肚子有规律地发紧发痛，间隔越来越短、疼痛越来越强，休息也不缓解。记录每次宫缩开始的时间和持续多久，按医生交代的间隔去医院。
      - heading: 什么时候找医生
        text: 阴道流血量像月经那么多或更多、颜色鲜红；羊水发绿、发黄或有异味；持续剧烈腹痛；胎动明显减少；不足 37 周出现以上任何一种信号——都要立即去医院。
    ask: [见红了多久会生, 破水是什么感觉, 宫缩几分钟一次要去医院]
    related: [birth.when-to-go, body.braxton-hicks, birth.hospital-bag]

  - id: birth.when-to-go
    title: 什么时候去医院
    aliases: [去医院, 什么时候去医院, 住院, 待产, 急诊]
    weeks: [36, 42]
    summary: 破水、规律宫缩到医生交代的间隔、出血多或胎动减少时，都应及时去医院；拿不准就打电话问。
    sections:
      - heading: 什么时候找医生
        text: 破水；阴道流血较多；持续剧烈腹痛；胎动明显减少或停止；头痛、眼花、抽搐；不足 37 周出现规律宫缩。这些情况不要等待观察，直接去医院或叫救护车。
      - heading: 规律宫缩时
        text: 第一次生孩子的常用参考是「5-1-1」：宫缩约 5 分钟一次、每次约 1 分钟、这样持续 1 小时，就该出发。生过孩子的产程可能更快，宫缩变规律（约 10 分钟一次）就联系医院。具体时机请提前问清楚你的产检医生，以医生交代为准。App 里的宫缩计时可以帮你算间隔。
      - heading: 提前准备
        text: 孕晚期提前规划好去医院的路线和交通方式，把待产包、证件和产检资料放在门口；了解医院产科急诊的位置和夜间入口。
    ask: [半夜宫缩要马上去医院吗, 见红了需要马上去吗, 去医院要走急诊吗]
    related: [birth.signs-of-labor, birth.hospital-bag, body.fetal-movement]

  - id: birth.delivery-modes
    title: 顺产与剖宫产
    aliases: [顺产, 剖腹产, 剖宫产, 自然分娩, 怎么生]
    weeks: [30, 40]
    summary: 没有医学指征时，阴道分娩通常是更推荐的方式；是否需要剖宫产由医生根据母婴情况评估。
    sections:
      - heading: 顺产
        text: 阴道分娩产后恢复一般更快，住院时间更短，对下一次怀孕的影响也更小。产程中医生会持续评估，必要时会改为剖宫产。
      - heading: 剖宫产
        text: 当存在胎位异常、前置胎盘、胎儿窘迫、产程停滞等医学原因时，剖宫产能保障母婴安全。它是一种手术，伤口恢复需要时间，也有手术相关风险。
      - heading: 怎么决定
        text: 孕晚期医生会根据胎位、宝宝大小、骨盆情况和你的身体状况给出建议。有顾虑或者害怕疼痛，可以和医生坦诚沟通，了解无痛分娩等选择。
    ask: [我能顺产吗, 顺产和剖腹产哪个好, 胎位不正一定要剖吗]
    related: [birth.epidural, birth.body-prep, birth.postpartum-day-one]

  - id: birth.epidural
    title: 无痛分娩
    aliases: [分娩镇痛, 打无痛, 硬膜外, 怕疼, 无痛]
    weeks: [32, 40]
    summary: 无痛分娩是由麻醉医生实施的椎管内镇痛，可以明显减轻宫缩痛，多数产妇都可以选择。
    sections:
      - heading: 是什么
        text: 麻醉医生在腰背部置入一根细管，持续给入低浓度镇痛药，让宫缩的疼痛明显减轻，产妇仍能感觉到宫缩、能配合用力。
      - heading: 安全吗
        text: 这是国内外广泛应用的成熟技术，使用的药物浓度低，目前认为对宝宝的影响很小。可能有血压下降、发热、皮肤发痒等反应，医生会监测和处理。是否适合你由麻醉医生评估。
      - heading: 怎么准备
        text: 提前了解生产医院是否提供无痛分娩、怎么申请；什么时候打由医生根据产程决定。有腰椎疾病、凝血问题等情况的，产检时提前告诉医生。
    ask: [无痛分娩对宝宝有影响吗, 打无痛会腰疼吗, 什么时候可以打无痛]
    related: [birth.delivery-modes, birth.when-to-go, birth.hospital-bag]

  - id: birth.hospital-bag
    title: 待产包准备
    aliases: [待产包, 住院准备, 生孩子带什么, 待产清单]
    weeks: [32, 38]
    summary: 建议孕 35 周左右前收拾好待产包，分成证件、妈妈用品、宝宝用品三类，放在随手能拿的地方。
    sections:
      - heading: 证件资料
        text: 双方身份证、医保卡或社保卡、母子健康手册、产检资料和病历、银行卡，以及医院要求的其他材料。各医院要求不同，可以提前问清楚。
      - heading: 妈妈用品
        text: 产褥垫、产妇卫生巾、一次性内裤、哺乳内衣、宽松的衣服和防滑拖鞋、洗漱用品、吸管杯、手机充电器，以及一些方便入口的食物和饮品。
      - heading: 宝宝用品
        text: 新生儿衣服和包被、纸尿裤、湿巾、小毛巾；是否需要准备奶瓶和奶粉，先问清楚医院的规定。出院时如果开车，提前装好婴儿安全座椅。
      - heading: 小建议
        text: 很多医院会提供部分产妇和新生儿用品，打听清楚后再买，避免重复。东西不必一次买齐，产后缺什么家人再送也来得及。
    ask: [待产包什么时候准备, 医院会提供哪些东西, 待产包要带奶粉吗]
    related: [birth.when-to-go, birth.signs-of-labor, paperwork.birth-services]

  - id: birth.body-prep
    title: 分娩前的身体准备
    aliases: [产前准备, 顺产准备, 拉梅兹呼吸, 盆底, 产前运动]
    weeks: [34, 40]
    summary: 孕晚期保持适度活动、学会分娩呼吸方法、保证休息和营养，能帮助更从容地面对分娩。
    sections:
      - heading: 适度活动
        text: 在医生允许的前提下，每天坚持散步等温和活动，保持体力。孕晚期不必刻意爬楼梯、深蹲来「催生」，量力而行即可。
      - heading: 学习方法
        text: 参加医院的孕妇学校，学习分娩的过程、呼吸放松方法和用力技巧；伴侣一起参加更好，能在产程中帮上忙。
      - heading: 休息与营养
        text: 保证充足睡眠和规律饮食，控制好体重和血糖。临产时可以吃些容易消化、能快速补充体力的食物，比如面条、巧克力、香蕉等，具体以医院要求为准。
      - heading: 心理准备
        text: 提前和医生沟通分娩方式和镇痛选择，了解可能的变化，比如产程中改为剖宫产。知道会发生什么，能减少不少紧张。
    ask: [孕晚期要多走路吗, 爬楼梯能帮助顺产吗, 临产前吃什么好]
    related: [life.exercise, birth.delivery-modes, birth.epidural]

  - id: birth.overdue
    title: 过了预产期
    aliases: [过预产期, 还没动静, 催产, 引产, 超预产期]
    weeks: [40, 42]
    summary: 预产期只是估算，到了 40 周还没生很常见；医生会加强监测，并在合适的时机安排住院或引产。
    sections:
      - heading: 很常见
        text: 只有一小部分宝宝正好在预产期当天出生，37 周到 42 周之间出生都算足月。过了预产期没动静，不代表有问题。
      - heading: 医生会怎么做
        text: 过了预产期后，医生通常会安排更频繁的胎心监护和 B 超，看羊水和胎盘情况。指南建议孕 41 周以后住院并引产，具体时机按医生安排。
      - heading: 自己能做什么
        text: 每天认真数胎动，按约定时间产检，保持适度活动和休息。网上流传的各种「催生」偏方不要轻易尝试。
      - heading: 什么时候找医生
        text: 胎动明显减少、破水、阴道流血或出现规律宫缩时，立即去医院，不要等到约好的日子。
    ask: [过了预产期还没动静怎么办, 引产会很疼吗, 41 周要住院吗]
    related: [body.fetal-movement, checkup.nst, birth.signs-of-labor]

  - id: birth.postpartum-day-one
    title: 产后第一天
    aliases: [刚生完, 产后, 月子第一天, 下奶, 开奶]
    weeks: [37, 42]
    # 讲的是生完以后，孕期首页推荐它太早。
    pick: false
    summary: 产后第一天重点是观察出血、尽早下地和排尿、让宝宝早接触早吸吮，有不适及时叫医护。
    sections:
      - heading: 产后观察
        text: 产后 2 小时内会在产房观察出血和血压。之后护士会定时按压肚子检查子宫收缩、看恶露量。顺产后通常要求几个小时内自己排尿，排不出来要告诉护士。
      - heading: 宝宝喂养
        text: 产后尽早让宝宝和妈妈皮肤接触，尽早开始吸吮乳头，有利于下奶。刚开始奶量少是正常的，频繁让宝宝吸吮比急着加奶粉更重要，有困难可以请护士指导。
      - heading: 活动与饮食
        text: 顺产后体力允许时，在家人陪同下尽早下床活动，第一次起身要慢，防止头晕摔倒。剖宫产后按医护要求逐步进食和下床。
      - heading: 什么时候找医生
        text: 出血量突然变多（如短时间内浸透卫生巾）或排出较大血块，头晕心慌、发热、剧烈头痛、胸痛气短、一侧小腿肿痛时，立即呼叫医护。
    ask: [生完多久可以下床, 刚生完没奶怎么办, 恶露多少算正常]
    related: [birth.delivery-modes, birth.hospital-bag, paperwork.birth-services]
