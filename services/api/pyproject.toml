[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aim-api"
version = "0.1.0"
description = "Aim pregnancy app business API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.135,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b1,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.60b1,<1",
  "opentelemetry-sdk>=1.39,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aim_api"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
